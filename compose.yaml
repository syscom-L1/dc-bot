name: dcbot-team-assistant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dcbot
      POSTGRES_PASSWORD: dcbot
      POSTGRES_DB: dcbot
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcbot -d dcbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_PORT:-6380}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://dcbot:dcbot@postgres:5432/dcbot?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  http:
    build: .
    command: ["node", "dist/entrypoints/http.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://dcbot:dcbot@postgres:5432/dcbot?schema=public}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://valkey:6379}
      HTTP_PORT: 3000
    ports:
      - "${HTTP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

  worker:
    build: .
    command: ["node", "dist/entrypoints/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://dcbot:dcbot@postgres:5432/dcbot?schema=public}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://valkey:6379}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

  scheduler:
    build: .
    command: ["node", "dist/entrypoints/scheduler.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://dcbot:dcbot@postgres:5432/dcbot?schema=public}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://valkey:6379}
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

  bot:
    build: .
    command: ["node", "dist/entrypoints/bot.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://dcbot:dcbot@postgres:5432/dcbot?schema=public}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://valkey:6379}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

volumes:
  postgres-data:
  valkey-data:
